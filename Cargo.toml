[workspace]
members = [
    "crates/goose-acp-client",
    "crates/mock-goose-server",
    "crates/opencode-client",
]

# ---------------------------------------------------------------- lint policy
#
# Strict by default: clippy's pedantic, nursery and cargo groups are on for
# every crate in the workspace, plus a shortlist of `restriction` lints that
# catch the failure modes this app actually has (a panic on a phone is a
# crash, not a stack trace someone reads). Every exception below carries its
# reason; one-off exceptions live in the code as
# `#[expect(lint, reason = "...")]`, which fails the build when it stops
# being needed.
#
# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so these
# warn levels are errors there while staying non-blocking in a local build.
#
# Deliberately NOT enabled: `missing_docs`. It fires 332 times across the two
# client crates, and the docs it asks for are restatements of the item name.
# The half that carries information — `missing_errors_doc`,
# `missing_panics_doc` (both pedantic) — is on and enforced.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- group exceptions, with reasons ---
# A duplicated transitive dependency version is the dependency graph's
# business, not this code's: nothing in this repo can resolve it.
multiple_crate_versions = "allow"
# Dioxus futures run on a single-threaded UI executor and hold !Send handles
# by design; requiring Send would mean not using the framework.
future_not_send = "allow"
# Nursery style lint that regularly makes match-on-Option harder to read.
option_if_let_else = "allow"
# Directly contradicts `unreachable_pub`, which we prefer: pub(crate) in a
# private module is exactly what unreachable_pub asks for.
redundant_pub_crate = "allow"

# --- restriction picks: not on by default, wanted here ---
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"

[package]
name = "goose-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mobile client (iOS/Android) for a remote goose AI agent server, written in Rust with Dioxus"
license = "MIT"

[dependencies]
# Featureless, and LOAD-BEARING even though it is compile-redundant — the two
# target-conditional tables below cover every triple, so nothing needs this
# entry to build. `dx` needs it. `dioxus-cli-0.7.10/src/build/renderer.rs:17`
# does `dependencies.iter().find(|dep| dep.name == "dioxus")` with no target
# filter and reads only that first entry's features, so this featureless one
# has to be the first one it meets. Deleting the line was tried: `dx check`
# then finds the `mobile` table instead and fails with "Could not autodetect
# mobile platform. Use --ios or --android instead." Do not tidy it away.
dioxus = { version = "0.7.10", features = [] }
dioxus-sdk-storage = "0.7.0"
goose-acp-client = { path = "crates/goose-acp-client" }
opencode-client = { path = "crates/opencode-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# ------------------------------------------------------- the renderer choice
#
# PLATFORM picks the renderer, at compile time, from the target triple — not
# from a cargo feature anybody has to remember to pass. `dioxus`'s `desktop`
# and `mobile` features are the SAME re-export of the SAME crate
# (`dioxus-0.7.10/src/lib.rs:107-113`: both are `pub use dioxus_desktop`), and
# `dioxus-desktop` already gates its platform-only surface on `target_os`
# using this repo's own predicate (`lib.rs:43-49`). So the feature added
# nothing the target did not already say, while costing every `cfg` in this
# crate a second clause and costing CI an argument
# (`--no-default-features --features mobile`) that had to be typed correctly
# on a job nobody watches.
#
# The guarantee is now stronger than a flag: on an iOS or Android target the
# `dioxus/desktop` feature is not enabled at all, so `dioxus::desktop` is
# unnameable there — a `cargo check --target aarch64-apple-ios` with DEFAULT
# features catches a stray window call as `error[E0433]`.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
dioxus = { version = "0.7.10", features = ["mobile"] }

# Test-only, and it buys the difference between a test that EXECUTES a view and
# one that asserts something about it. Rendering a component in a `VirtualDom`
# runs its body — which is all coverage counts — but with no way to read the
# output back, every view test would be `it did not panic`, which is coverage
# theatre and would make the 95% bar actively misleading.
#
# `dioxus-ssr` and not `dioxus = { features = ["ssr"] }`, deliberately: the
# feature form unions `ssr` into the `dioxus` entry that `dx`'s platform
# autodetection reads (`dioxus-cli-0.7.10/src/build/renderer.rs:7-30`), and the
# three measured facts recorded under `[features]` below are all about how
# easily that detection is broken. A separate dev-dependency cannot reach it.
# Checked after adding: `dx check` still resolves the desktop renderer.
[dev-dependencies]
dioxus-ssr = "0.7"

[lints]
workspace = true

# A MARKER for `dx`, not a switch. It enables nothing, and the real selection
# is the two target-conditional [dependencies] tables above. Three things
# about it were measured, because all three are easy to get wrong:
#
# 1. It cannot be DELETED. `dioxus-cli-0.7.10/src/build/renderer.rs:7-30`
#    reads these keys to autodetect a platform; with the table gone,
#    `dx check` fails with "Could not automatically detect target triple".
#    That cost an earlier pass a round.
# 2. It cannot be RENAMED. `dioxus-cli-0.7.10/src/platform.rs:188-196` matches
#    only web/desktop/mobile/native/liveview/server; renaming the key to
#    `shell` reproduces the same "target triple" failure, and renaming it to
#    `mobile` — the other name this repo would reach for — fails differently,
#    with "Could not autodetect mobile platform. Use --ios or --android".
# 3. It is ON EVERYWHERE, phones included, so `feature = "desktop"` is TRUE in
#    an iOS build and the name lies. (Measured: a `compile_error!` under
#    `cfg(all(feature = "desktop", target_os = "ios"))` fires under
#    `cargo check --target aarch64-apple-ios`. Under `dx` too, which always
#    passes `--no-default-features` and then re-adds `desktop` alongside
#    `dioxus/mobile` — `request.rs:1675-1685`.) Nothing reads it and nothing
#    may start to: `src/shell/mod.rs`'s `no_cfg_reads_the_dx_marker_feature`
#    test fails the build if any `cfg` in `src/` ever does.
[features]
default = ["desktop"]
desktop = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
