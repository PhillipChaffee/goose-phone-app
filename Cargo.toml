[workspace]
members = [
    "crates/goose-acp-client",
    "crates/mock-goose-server",
    "crates/mock-opencode-server",
    "crates/opencode-client",
]

# ---------------------------------------------------------------- lint policy
#
# Strict by default: clippy's pedantic, nursery and cargo groups are on for
# every crate in the workspace, plus a shortlist of `restriction` lints that
# catch the failure modes this app actually has (a panic on a phone is a
# crash, not a stack trace someone reads). Every exception below carries its
# reason; one-off exceptions live in the code as
# `#[expect(lint, reason = "...")]`, which fails the build when it stops
# being needed.
#
# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so these
# warn levels are errors there while staying non-blocking in a local build.
#
# Deliberately NOT enabled: `missing_docs`. It fires 332 times across the two
# client crates, and the docs it asks for are restatements of the item name.
# The half that carries information — `missing_errors_doc`,
# `missing_panics_doc` (both pedantic) — is on and enforced.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- group exceptions, with reasons ---
# A duplicated transitive dependency version is the dependency graph's
# business, not this code's: nothing in this repo can resolve it.
multiple_crate_versions = "allow"
# Dioxus futures run on a single-threaded UI executor and hold !Send handles
# by design; requiring Send would mean not using the framework.
future_not_send = "allow"
# Nursery style lint that regularly makes match-on-Option harder to read.
option_if_let_else = "allow"
# Directly contradicts `unreachable_pub`, which we prefer: pub(crate) in a
# private module is exactly what unreachable_pub asks for.
redundant_pub_crate = "allow"

# --- restriction picks: not on by default, wanted here ---
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"

[package]
name = "goose-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mobile client (iOS/Android) for a remote goose AI agent server, written in Rust with Dioxus"
license = "MIT"

[dependencies]
# Featureless, and LOAD-BEARING even though it is compile-redundant — the two
# target-conditional tables below cover every triple, so nothing needs this
# entry to build. `dx` needs it. `dioxus-cli-0.7.10/src/build/renderer.rs:17`
# does `dependencies.iter().find(|dep| dep.name == "dioxus")` with no target
# filter and reads only that first entry's features, so this featureless one
# has to be the first one it meets. Deleting the line was tried: `dx check`
# then finds the `mobile` table instead and fails with "Could not autodetect
# mobile platform. Use --ios or --android instead." Do not tidy it away.
dioxus = { version = "0.7.10", features = [] }
dioxus-sdk-storage = "0.7.0"
goose-acp-client = { path = "crates/goose-acp-client" }
opencode-client = { path = "crates/opencode-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# ------------------------------------------------------- the renderer choice
#
# PLATFORM picks the renderer, at compile time, from the target triple — not
# from a cargo feature anybody has to remember to pass. `dioxus`'s `desktop`
# and `mobile` features are the SAME re-export of the SAME crate
# (`dioxus-0.7.10/src/lib.rs:107-113`: both are `pub use dioxus_desktop`), and
# `dioxus-desktop` already gates its platform-only surface on `target_os`
# using this repo's own predicate (`lib.rs:43-49`). So the feature added
# nothing the target did not already say, while costing every `cfg` in this
# crate a second clause and costing CI an argument
# (`--no-default-features --features mobile`) that had to be typed correctly
# on a job nobody watches.
#
# The guarantee is now stronger than a flag: on an iOS or Android target the
# `dioxus/desktop` feature is not enabled at all, so `dioxus::desktop` is
# unnameable there — a `cargo check --target aarch64-apple-ios` with DEFAULT
# features catches a stray window call as `error[E0433]`.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
dioxus = { version = "0.7.10", features = ["mobile"] }

# Test-only, and it buys the difference between a test that EXECUTES a view and
# one that asserts something about it. Rendering a component in a `VirtualDom`
# runs its body — which is all coverage counts — but with no way to read the
# output back, every view test would be `it did not panic`, which is coverage
# theatre and would make the 95% bar actively misleading.
#
# `dioxus-ssr` and not `dioxus = { features = ["ssr"] }`, deliberately: the
# feature form unions `ssr` into the `dioxus` entry that `dx`'s platform
# autodetection reads (`dioxus-cli-0.7.10/src/build/renderer.rs:7-30`), and the
# three measured facts recorded under `[features]` below are all about how
# easily that detection is broken. A separate dev-dependency cannot reach it.
# Checked after adding: `dx check` still resolves the desktop renderer.
[dev-dependencies]
dioxus-ssr = "0.7"

# A runtime for the tests that touch code which constructs a `tokio` timer or
# spawns onto one — `show_toast`'s four-second dismissal, `spawn_forever` in the
# state pump. The runtime is entered so those constructions do not panic;
# nothing waits on it.
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }

# `AcpClient` has no constructor that is not `connect`, so the only way to
# drive the half of a feature module that runs WITH a client is to put a socket
# in front of it. `src/scheduler.rs`'s harness stands up a plain-`ws://`
# JSON-RPC server on a loopback port and connects to that; `ws_url` only reaches
# for TLS on an `https://` base, so no certificate is involved.
#
# Both versions are ones the workspace already resolves for
# `crates/mock-goose-server`, so neither adds a package to `Cargo.lock`.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }

[lints]
workspace = true

# A MARKER for `dx`, not a switch. It enables nothing, and the real selection
# is the two target-conditional [dependencies] tables above. Three things
# about it were measured, because all three are easy to get wrong:
#
# 1. It cannot be DELETED. `dioxus-cli-0.7.10/src/build/renderer.rs:7-30`
#    reads these keys to autodetect a platform; with the table gone,
#    `dx check` fails with "Could not automatically detect target triple".
#    That cost an earlier pass a round.
# 2. It cannot be RENAMED. `dioxus-cli-0.7.10/src/platform.rs:188-196` matches
#    only web/desktop/mobile/native/liveview/server; renaming the key to
#    `shell` reproduces the same "target triple" failure, and renaming it to
#    `mobile` — the other name this repo would reach for — fails differently,
#    with "Could not autodetect mobile platform. Use --ios or --android".
# 3. It is ON EVERYWHERE, phones included, so `feature = "desktop"` is TRUE in
#    an iOS build and the name lies. (Measured: a `compile_error!` under
#    `cfg(all(feature = "desktop", target_os = "ios"))` fires under
#    `cargo check --target aarch64-apple-ios`. Under `dx` too, which always
#    passes `--no-default-features` and then re-adds `desktop` alongside
#    `dioxus/mobile` — `request.rs:1675-1685`.) Nothing reads it and nothing
#    may start to: `src/shell/mod.rs`'s `no_cfg_reads_the_dx_marker_feature`
#    test fails the build if any `cfg` in `src/` ever does.
[features]
default = ["desktop"]
desktop = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The profile for RUNNING the app, as opposed to shipping it. `dx serve
# --desktop --profile fast`, which is what `scripts/serve-real.sh` now does.
#
# Every documented way to run this app was `dx serve`, i.e. `dev`, i.e.
# `opt-level = 0` for every dependency it compiles — 462 units on this target,
# out of the 602 entries in `Cargo.lock`; dioxus's diff, dioxus-signals,
# ciborium, pulldown-cmark, the lot. Measured on a 600-item /
# 400 KB markdown re-parse (`markdown::to_html` over the repo's own prose;
# four binaries run round-robin so one machine state prices all of them, best
# of 7 within a round, best of 5 rounds, M3 Max):
#
#     dev                                13.67 ms   1.0x
#     dev + package."*" opt-level = 2     7.01 ms   1.9x
#     this profile (opt-level = 2)        2.08 ms   6.6x
#     the same at opt-level = 3           1.93 ms   7.1x
#
# 6.6x, and the same multiplier is sitting on every millisecond figure in
# #307's other children. The round-robin is not ceremony. An unrelated build
# starting on this machine moved the `dev` figure from 12.6 ms to 18.6 ms
# between two runs, so a before and an after taken an hour apart would have
# been a number about the machine; inside one interleaved run the two drift
# TOGETHER and the ratio held at 5.7-6.5x across six rounds.
#
# THE THREE THINGS THAT MAKE THIS THE RIGHT SHAPE, each of which was the reason
# some more obvious version is not here:
#
# 1. NOT `--release`. `dev_seed!` (`src/state.rs`) is `#[cfg(debug_assertions)]
#    option_env!` with an empty else-arm, deliberately, so a development
#    endpoint cannot ride along into a shipped binary. A release build
#    therefore blanks all six `GOOSE_DEV_*` seeds — and `secret_key` and
#    `code_password` are `#[serde(skip_serializing)]`, so no saved file refills
#    them either. `--release` turns the launcher into "retype two secrets per
#    launch", which is the exact outcome `Settings`' own doc comment says the
#    arrangement exists to avoid. `inherits = "dev"` keeps
#    `debug-assertions = true`, which is the whole reason this works and so was
#    checked twice rather than assumed: `dx build --desktop --profile fast`
#    leaves its own rustc arguments in `target/dx/.captured-args/` and they read
#    `-C opt-level=2 -C debug-assertions=on`, and a `--profile fast` binary
#    built with a `GOOSE_DEV_SECRET_KEY` set has that string in it.
#
# 2. NOT `[profile.dev]` itself, even though the numbers are the same. CI runs
#    `clippy --all-targets`, `test --workspace`, `llvm-cov --workspace` and the
#    iOS `cargo check` in `dev` (`.github/workflows/ci.yml`), and coverage
#    instrumentation at `opt-level = 2` can move the line counts the 95% gate
#    reads. A separate profile leaves every gate on the build it was measured
#    against and costs the run a flag.
#
# 3. NOT `[profile.dev.package."*"] opt-level = 2`, the usual one-liner, which
#    recovered 1.9x of the 6.6x above — it sets the opt-level of code compiled
#    in the DEPENDENCY's codegen unit, and `html::push_html` is generic over its
#    event iterator, so it monomorphises into `goose-mobile`'s unit and stays at
#    0, as does the `filter_map` in `markdown::to_html`. Any hot loop whose real
#    work is a generic instantiated locally behaves the same way, and `rsx!` and
#    dioxus's diff are exactly that shape.
#
# The price is the COLD build and only the cold build. A profile is its own
# target directory, so the first `--profile fast` recompiles the whole graph:
# 2m31s against 49s for a cold `dev`, both `cargo build -p goose-mobile` into an
# empty target dir. After that it is a wash, which is the result that decided
# this — `inherits = "dev"` also inherits `incremental = true`, so a save
# re-optimises one codegen unit and nothing else: three edits to
# `src/views/chat.rs` rebuilt in 2.02/2.07/2.72s under `fast` against
# 2.35/2.38/2.57s under `dev`. Nothing in CI builds this profile.
#
# `opt-level = 2` and not `3`: 3 measured inside 2's run-to-run spread on this
# workload (1.93 ms against 2.08 ms at the best, and SLOWER than 2 in two of the
# five interleaved rounds), so there is nothing to buy. `lto` is off because it
# is a link-time cost paid on every incremental rebuild, and the wash in the
# paragraph above is the property this profile cannot afford to lose.
[profile.fast]
inherits = "dev"
opt-level = 2
