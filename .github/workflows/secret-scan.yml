# Secret scanning, in two jobs that scan DIFFERENT things. That distinction is
# the whole point of this file, and the sibling repo it is modelled on
# (PhillipChaffee/personal-ai-setup, its #76) paid for getting it wrong once:
# its header used to claim the first job did the second job's work, so
# `fetch-depth: 0` was buying history that was then never scanned.
#
#   gitleaks   INCREMENTAL, every push and pull request. gitleaks-action derives
#              a `--log-opts` range from the EVENT — a push of one commit runs
#              `--log-opts=-1`. Seconds, and it is what blocks a secret at the
#              moment it is introduced.
#
#   history    THE WHOLE LOG, weekly and on demand. Only this job can find a
#              secret in an OLD commit, because the job above ever saw that
#              commit once, on the day it was pushed, under whatever ruleset
#              shipped that day — and because a secret "removed" in a later
#              commit is still in every clone.
#
# WHY THIS REPO NEEDS IT, specifically rather than in general (#290): it is
# public, it is ~280 commits deep, and this campaign has spent weeks driving it
# against a real brain. `scripts/serve-real.sh` moves two real credentials out
# of the login Keychain and into a child process's environment; `dev_seed!`
# bakes whatever is in that environment into a debug binary; and three gallery
# captures have committed the app's entire serialised DOM. None of that is a
# leak. All of it is a class of accident with no defence in the repo until now.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Tuesdays 07:43 UTC. Off the hour because GitHub sheds scheduled
    # runs at peak times and nobody is watching for this one to not happen; off
    # the sibling repo's Monday 06:17 so the two do not queue behind each other.
    - cron: "43 7 * * 2"
  workflow_dispatch:

# ci.yml's policy, for ci.yml's reason: a superseded branch run is disposable,
# but every commit on main is one somebody will look up later and a cancelled
# run leaves it with no verdict at all. "Was this commit scanned?" is exactly
# the question this workflow exists to be able to answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# gitleaks-action needs pull-requests:read on a pull_request event — it lists
# the PR's commits through the API to derive its range, and without the scope
# it 403s with "Resource not accessible by integration" before scanning
# anything, which is a green-looking job that scanned nothing.
permissions:
  contents: read
  pull-requests: read

# ONE VERSION, THREE PLACES, and they are kept equal on purpose: the
# `.pre-commit-config.yaml` rev, the `GITLEAKS_VERSION` handed to the action,
# and the pinned binary below. Left alone the action uses its own bundled
# default (8.24.3 in v3.0.0), so the hook, the incremental job and the backstop
# would enforce three different rulesets and disagree about the same commit.
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes from CI, so the token has no business surviving
          # in .git/config where a later step could pick it up (zizmor:
          # artipacked).
          persist-credentials: false
          # THE RANGE'S CONTEXT, NOT ITS EXTENT. gitleaks-action computes which
          # commits to scan from the event and needs them present to walk. It
          # does not make this job full-history — the `history` job below is
          # the only thing in this repo that is.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Read by the action's own license check, which calls
          # `GET /users/{owner}` to decide whether one is needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_VERSION is not restated here: workflow-level `env` merges
          # into every step's environment, `uses:` steps included, so the action
          # already reads the one declared above.
          #
          # GITLEAKS_LICENSE is required for GitHub *organization* repos only;
          # a personal-account owner runs free, which the action confirms in its
          # own log ("is an individual user. No license key is required."). If
          # this repo ever moves into an org, add the key as a repo secret:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # THE BACKSTOP. Everything above sees a commit exactly once, on the day it is
  # pushed. This re-reads all of them, so a secret that slipped an older ruleset
  # — or one committed and then deleted, which does not delete it from history —
  # is still found.
  history:
    name: gitleaks (full history)
    # Only where it is meaningful. On a push the incremental job has already
    # scanned exactly the new commits, and re-deriving an unchanged answer over
    # ~280 commits on every push is minutes spent to learn nothing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # LOAD-BEARING HERE, unlike above: this job's extent really is the
          # whole log, and a shallow clone would silently scan only the tip and
          # report the same "no leaks found" it reports when there are none.
          fetch-depth: 0

      # THE BINARY, NOT THE ACTION. The action derives its range from the event;
      # run outside a push or pull_request its behaviour is an assumption, and
      # this job's entire value is that its extent is certain. `gitleaks git`
      # with no `--log-opts` walks every commit.
      #
      # Checksum-verified, because a pinned version downloaded over the network
      # is a pin on a name rather than on bytes.
      - name: Install gitleaks (pinned)
        env:
          # From gitleaks_${GITLEAKS_VERSION}_checksums.txt on the release.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # PROVES THE SCAN IS REALLY FULL-HISTORY BEFORE THE REAL ONE IS TRUSTED.
      # Without this the job's success is indistinguishable from a job that
      # scanned nothing, which is the only failure mode that matters in a
      # backstop: it is silent, and it is silent for months.
      #
      # Two assertions, not one. The sibling repo asserts only the first, and
      # that alone would also pass if the delete had not happened and the secret
      # were simply sitting in the tree — a green light for the wrong reason.
      # Confined to $RUNNER_TEMP, so the checkout is never touched.
      - name: Negative test — a secret in an OLD commit must be found
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/history-probe"
          rm -rf "$work"; mkdir -p "$work"; cd "$work"
          git init -q .
          git config user.email probe@example.invalid
          git config user.name probe
          # GENERATED, NEVER A LITERAL. A secret-shaped constant committed here
          # would be found by this repo's own pre-commit hook and by the
          # incremental job above — correctly, since neither can tell a fixture
          # from the real thing. A fresh random value each run is also a better
          # test than a constant an allowlist could learn to skip.
          printf 'api_key = "%s"\n' "$(openssl rand -hex 32)" > s.txt
          git add s.txt && git commit -qm "first: plants it"
          git rm -q s.txt && git commit -qm "second: removes it from the tree"

          rc=0
          gitleaks dir --no-banner --redact --exit-code 1 . >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the probe's WORKING TREE is not clean, so a history" \
                 "scan finding this secret would prove nothing"
            exit 1
          fi

          rc=0
          gitleaks git --no-banner --redact --exit-code 1 . >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::gitleaks did not find a secret that exists only in an" \
                 "earlier commit — this job is not scanning history"
            exit 1
          fi
          echo "Confirmed: clean tree, and gitleaks still finds the buried secret."

      # `gitleaks git`, not the `detect` of older recipes: 8.19 renamed the
      # commands and 8.30 no longer lists `detect` in `--help` at all. It still
      # resolves today, and a scanner that silently stops running is the one
      # kind of rot this file cannot afford.
      - name: Run gitleaks over every commit
        run: gitleaks git --no-banner --redact -v --exit-code 1 .
