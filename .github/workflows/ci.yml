name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Check & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dioxus desktop renderer (also used by the mobile build) links
      # against WebKitGTK on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev

      # No toolchain step: rust-toolchain.toml pins the channel and its
      # components, and rustup installs them on the first cargo call. One
      # source of truth for CI and for a developer's checkout.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The audit reads docs/gallery-states.json — markup the app really produced,
  # captured by scripts/capture-gallery.py — and measures what is easier to
  # measure than to see: overflow, clipped text, square corners, sub-32px
  # buttons, and every piece of text and every icon against its contrast bar.
  # The repo has had it, and its node_modules, since before this job existed;
  # what it did not have was anything running it, so the gate the styling work
  # leans on was a gate somebody had to remember.
  ui-audit:
    name: UI audit (gallery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chromium only: the audit lays the states out in one, and the other two
      # engines are a download apiece for nothing this measures.
      # `npm install`, not `npm ci`: there is no lockfile in the repo, and the
      # one dependency is a browser driver pinned by a caret range.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Audit both themes
        run: node docs/audit.js both

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml; llvm-tools is needed only
      # by this job, so it is added here rather than for every checkout.
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      # Coverage is measured on the two protocol libraries: they are the
      # UI-independent, unit-testable half of the workspace. The Dioxus crate
      # needs a renderer to execute at all, so counting its lines would report
      # a number about the test setup rather than about the code.
      - name: Generate coverage
        run: >
          cargo llvm-cov --package goose-acp-client --package opencode-client
          --lcov --output-path lcov.info

      - name: Coverage summary
        run: >
          cargo llvm-cov report --package goose-acp-client --package opencode-client
          --summary-only

      # Coveralls authenticates with the GITHUB_TOKEN that Actions provides
      # automatically: no account to create, no repository secret, and it
      # registers the repo on first upload. That is why 517f6a2 chose it, and
      # why a detour through Codecov was a mistake — Codecov needs a token for
      # uploads onto a protected branch and answers "Repository not found"
      # until someone signs up, so it reported nothing at all in the meantime.
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov

  ios:
    name: Build check (iOS target)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml; the iOS target is needed
      # only by this job.
      - name: Add the iOS target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      # No feature flags: the renderer is chosen by target-conditional
      # [dependencies] tables in Cargo.toml, so the triple is the whole
      # instruction. That is the point of the arrangement — this job used to
      # be the only place `--features mobile` was typed, which made the
      # iOS/desktop split depend on a line in a YAML file nobody reads.
      - name: Check the iOS build
        run: cargo check --package goose-mobile --target aarch64-apple-ios
