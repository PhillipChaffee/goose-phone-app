name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Check & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dioxus desktop renderer (also used by the mobile build) links
      # against WebKitGTK on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      # Coverage is measured on the protocol library: it is the
      # UI-independent, unit-testable half of the workspace.
      - name: Generate coverage
        run: cargo llvm-cov --package goose-acp-client --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --package goose-acp-client --summary-only

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Keep CI green before the repository is linked on codecov.io.
          fail_ci_if_error: false

  ios:
    name: Build check (iOS target)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Check the iOS build
        run: >
          cargo check --package goose-mobile --no-default-features
          --features mobile --target aarch64-apple-ios
