[package]
name = "opencode-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Client for the brain's code-agent plane: the session manager API and per-chat OpenCode servers (HTTP + SSE)"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
