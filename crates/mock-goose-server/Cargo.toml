[package]
name = "mock-goose-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Protocol-faithful mock of `goose serve` (ACP over WebSocket) for testing the app without an AI provider"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"

# The extension tests below feed this mock the exact JSON the real client
# emits, rather than a hand-written copy of it that could drift.
[dev-dependencies]
goose-acp-client = { path = "../goose-acp-client" }

[lints]
workspace = true
